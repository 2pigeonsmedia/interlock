<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Interlock mark: two interlocked rings. Teal + mid-gray so the icon
       reads on both light and dark browser chrome. -->
  <mask id="weave"><rect width="100" height="100" fill="white"/><circle cx="50" cy="31.6" r="9" fill="black"/></mask>
  <circle cx="38" cy="50" r="22" fill="none" stroke="#2CE5CB" stroke-width="9"/>
  <circle cx="62" cy="50" r="22" fill="none" stroke="#808A94" stroke-width="9" mask="url(#weave)"/>
</svg>
