<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital@0;1&display=swap">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#26282B;color:#F3F4F6;font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}

.tag em{font-family:"Libre Caslon Text","Iowan Old Style","Palatino Linotype",Georgia,serif;font-style:italic;color:#37C4B2}

</div></div></body></html>
